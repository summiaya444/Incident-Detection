name: incident_reporting_app
description: A modern emergency reporting application

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_vector_icons: ^1.0.0
  image_picker: ^0.8.7+1
  shimmer: ^2.0.0
  animated_text_kit: ^4.2.2
  percent_indicator: ^4.2.2
  flutter_neumorphic: ^3.2.0
  badges: ^2.0.3
  smooth_page_indicator: ^1.0.0
  flutter_svg: ^1.1.6
  lottie: ^2.7.0
  flutter_animate: ^4.1.1
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  geolocator: ^14.0.2
#  geolocation: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/animations/success.json
    - assets/images/onboard_1.png
    - assets/images/onboard_2.png
    - assets/images/onboard_3.png
    - assets/images/logo.png
    - assets/images/bg_pattern.jpeg

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
